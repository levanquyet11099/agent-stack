name: agent-stack

# OpenTelemetry dùng chung cho REST, GraphQL, MCP (Bài 4). Mỗi service tự đặt OTEL_SERVICE_NAME.
x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_NODE_ENABLED_INSTRUMENTATIONS: http,express,graphql,undici
  OTEL_NODE_RESOURCE_DETECTORS: env,host,os,process   # bỏ dò cloud (GCP/AWS) gây cảnh báo khi chạy local

services:
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: synapse
    ports: ["8008:8008"]
    volumes: ["./synapse-data:/data"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  element:
    image: vectorim/element-web:latest
    container_name: element
    ports: ["8080:80"]
    volumes: ["./element/config.json:/app/config.json:ro"]
    depends_on: [synapse]

  user-api:
    build: ./services/user-api
    container_name: user-api
    ports: ["8001:8000"]
    volumes: ["./data:/data"]
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: user-api
      API_KEY: ${API_KEY:-dev-key}
      DB_PATH: /data/users.db
    depends_on: [jaeger]

  task-api:
    build: ./services/task-api
    container_name: task-api
    ports: ["8002:8000"]
    volumes: ["./data:/data"]
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: task-api
      API_KEY: ${API_KEY:-dev-key}
      DB_PATH: /data/tasks.db
      USER_API_URL: http://user-api:8000
    depends_on: [user-api, jaeger]

  graphql:
    build: { context: ., dockerfile: services/graphql/Dockerfile }
    container_name: graphql
    ports: ["8003:8000"]
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: graphql
      API_KEY: ${API_KEY:-dev-key}
      USER_API_URL: http://user-api:8000
      TASK_API_URL: http://task-api:8000
    depends_on: [user-api, task-api, jaeger]

  mcp:
    build: ./services/mcp
    container_name: mcp
    ports: ["8004:8000"]
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: mcp
      GRAPHQL_URL: http://graphql:8000/graphql
    depends_on: [graphql, jaeger]

  openclaw:
    build: ./openclaw
    container_name: openclaw
    volumes:
      - openclaw-data:/root/.openclaw                                  # trạng thái, plugin, session
      - ./openclaw/openclaw.json:/root/.openclaw/openclaw.json         # cấu hình (bí mật, không commit)
      - ./openclaw/workspace:/root/.openclaw/workspace                 # persona IDENTITY/SOUL/AGENTS/USER
    depends_on: [synapse, mcp]
    restart: unless-stopped

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    container_name: jaeger
    ports: ['16686:16686', '4317:4317', '4318:4318']   # UI, OTLP gRPC, OTLP HTTP

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    container_name: keycloak
    command: start-dev
    ports: ['8180:8080']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin     # chỉ dùng local, chỉ áp dụng ở lần chạy đầu
      KC_HOSTNAME: http://localhost:8180     # cố định issuer dù gọi từ trình duyệt hay từ Synapse
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true' # cho Synapse gọi qua http://keycloak:8080 trong mạng Docker
    volumes: ['keycloak-data:/opt/keycloak/data']

volumes:
  keycloak-data:
  openclaw-data:
