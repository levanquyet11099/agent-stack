        total: { type: integer }
        open: { type: integer }
        done: { type: integer }
        overdue: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [NOT_FOUND] }
            message: { type: string }
            details: {}
  responses:
    Unauthorized:
      description: Thiếu hoặc sai X-API-Key
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Không tìm thấy
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Tham số không hợp lệ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
